<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum AI Trading Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #050b14;
            --card-bg: #0d1527;
            --border-color: #1a2744;
            --accent-blue: #0066ff;
            --accent-glow: rgba(0, 102, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: #8a9bb8;
            --green: #00c853;
            --red: #ff3d00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }
        .ticker-wrap { background: #080f1d; overflow: hidden; white-space: nowrap; width: 100%; border-bottom: 1px solid var(--border-color); padding: 8px 0; font-size: 12px; color: var(--text-muted); }
        .ticker { display: inline-block; animation: ticker 25s linear infinite; }
        .ticker-item { display: inline-block; padding: 0 20px; }
        .ticker-item span { color: var(--green); font-weight: bold; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-dot { width: 12px; height: 12px; background: var(--accent-blue); border-radius: 50%; box-shadow: 0 0 10px var(--accent-blue); }
        .logo-text { font-size: 18px; font-weight: 800; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .mode-toggle { display: flex; background: #050b14; border-radius: 10px; padding: 4px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .mode-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 8px; font-weight: 600; border-radius: 8px; cursor: pointer; }
        .mode-btn.active { background: var(--accent-blue); color: white; box-shadow: 0 0 12px var(--accent-glow); }
        .balance-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .balance-amount { font-size: 32px; font-weight: 800; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; text-align: center; }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-val { font-size: 15px; font-weight: 700; }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        select, input { width: 100%; background: #050b14; border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
        .action-btn { width: 100%; background: var(--accent-blue); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .action-btn.stop { background: var(--red); }
        .chart-container { position: relative; height: 200px; width: 100%; margin-top: 10px; }
        .trade-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .trade-pair { font-weight: 700; }
        .trade-profit.win { color: var(--green); font-weight: 700; }
        .trade-profit.loss { color: var(--red); font-weight: 700; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { text-align: center; color: var(--text-muted); font-size: 11px; }
        .nav-item.active { color: var(--accent-blue); }
    </style>
</head>
<body>
    <div class="ticker-wrap">
        <div class="ticker">
            <div class="ticker-item">EUR/USD <span>1.0842 ▲</span></div>
            <div class="ticker-item">GBP/USD <span>1.2650 ▲</span></div>
            <div class="ticker-item">USD/JPY <span>154.20 ▼</span></div>
            <div class="ticker-item">AUD/USD <span>0.6510 ▲</span></div>
        </div>
    </div>
    <div class="header">
        <div class="logo-area">
            <div class="logo-dot"></div>
            <div class="logo-text">QUANTUM AI</div>
        </div>
    </div>
    <div class="container">
        <div class="card">
            <div class="mode-toggle">
                <button class="mode-btn active" id="demo-mode-btn" onclick="switchMode('demo')">Demo mode</button>
                <button class="mode-btn" id="real-mode-btn" onclick="switchMode('real')">Real account</button>
            </div>
            <div class="balance-title" id="balance-label">Your demo balance</div>
            <div class="balance-amount" id="balance-display">$10,000.00</div>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-label">Profit today</div><div class="stat-val" id="stat-profit" style="color: var(--green);">+$0.00</div></div>
                <div class="stat-box"><div class="stat-label">Trades</div><div class="stat-val" id="stat-trades">0</div></div>
                <div class="stat-box"><div class="stat-label">Winrate</div><div class="stat-val" id="stat-winrate">0%</div></div>
            </div>
            <div class="control-group">
                <label>Select Forex Pair</label>
                <select id="pair-select"><option value="EURUSD">EUR/USD</option><option value="GBPUSD">GBP/USD</option></select>
            </div>
            <button class="action-btn" id="toggle-trade-btn" onclick="toggleTrading()">Start Auto Trading</button>
        </div>
    </div>
    <script>
        let isTrading = false;
        function switchMode(m) { document.getElementById('balance-display').innerText = m === 'demo' ? '$10,000.00' : '$2,450.50'; }
        function toggleTrading() {
            isTrading = !isTrading;
            const btn = document.getElementById('toggle-trade-btn');
            btn.innerText = isTrading ? "Stop Auto Trading" : "Start Auto Trading";
            btn.classList.toggle('stop', isTrading);
        }
    </script>
</body>
</html>
