name: Build Quantum Leads AI APK

on:
  push:
    branches:
      - quantum-leads-ai-android
    paths:
      - 'quantum-leads-ai/android/**'
      - '.github/workflows/build-quantum-leads-ai-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android packaging branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: quantum-leads-ai/android
        run: gradle --no-daemon assembleDebug

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quantum-leads-ai-android-v1.0.0
          name: Quantum Leads AI Android 1.0.0
          draft: false
          prerelease: false
          files: quantum-leads-ai/android/app/build/outputs/apk/debug/app-debug.apk
